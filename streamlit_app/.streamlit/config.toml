[theme]
base = "light"
primaryColor = "#4C51BF"
backgroundColor = "#FBFCFF"
secondaryBackgroundColor = "#F0F2FA"
textColor = "#17213A"
linkColor = "#3F46A5"
borderColor = "#DDE2F0"
redColor = "#C43D51"
orangeColor = "#C07818"
greenColor = "#16836B"
blueColor = "#2677A8"
violetColor = "#6654B3"
grayColor = "#64708A"
chartCategoricalColors = ["#D1495B", "#EDAE49", "#00798C", "#8E7DBE", "#4C51BF"]
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
headingFontWeights = [700, 650, 650, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F3F4FA"
secondaryBackgroundColor = "#E7E9F5"
textColor = "#17213A"
primaryColor = "#4C51BF"
borderColor = "#DDE2F0"

[server]
maxUploadSize = 20

