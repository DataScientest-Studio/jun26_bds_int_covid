services:
  streamlit:
    build:
      context: ..
      dockerfile: streamlit_app/Dockerfile
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - dokploy-network
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

networks:
  dokploy-network:
    external: true
